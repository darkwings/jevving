# JEV

jev.api-key=${TYPESAFE_API_KEY}
jev.base-url=https://api.typesafe.ai
jev.model=jev-latest

quarkus.rest-client.jev.url=${jev.base-url}

# Urgency

urgency.limit=0.9

# Dispatch: below this confidence the ticket needs a human review

dispatch.confidence-limit=0.7

# OpenAPI

quarkus.smallrye-openapi.info-title=Jevving API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Support ticket dispatcher powered by Jev
